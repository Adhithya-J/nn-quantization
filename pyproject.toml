[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nn-quantization-study"
version = "0.1.0"
description = "Post-training quantization experiments for pretrained neural networks"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "torchvision>=0.16"]

[tool.setuptools.packages.find]
where = ["src"]
